name: Paseo Max Linux Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Fork package version (for example 0.13.0-max.1)"
        required: true
        default: "0.13.0-max.2"
        type: string
      source_run_id:
        description: "Promote an existing successful package artifact; leave blank for a fresh build"
        required: false
        default: ""
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: paseo-max-linux-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ONNXRUNTIME_NODE_INSTALL: skip
      NODE_OPTIONS: --max-old-space-size=6144
      BUILD_VERSION: ${{ inputs.version }}
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      PASEO_PACKAGED_EXECUTABLE: PaseoMax
      PASEO_DESKTOP_SMOKE: "1"
      EP_GH_IGNORE_TIME: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: inputs.source_run_id == ''
        with:
          node-version: "22"
          cache: npm

      - name: Validate package version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';
          if (!/^\d+\.\d+\.\d+-max\.[1-9]\d*$/.test(process.env.BUILD_VERSION)) {
            throw new Error('Expected a fork version such as 0.13.0-max.1');
          }
          if (process.env.SOURCE_RUN_ID && !/^\d+$/.test(process.env.SOURCE_RUN_ID)) {
            throw new Error('Expected a numeric source run ID');
          }
          const tag = `paseo-max-v${process.env.BUILD_VERSION}`;
          let sourceSha = process.env.GITHUB_SHA;
          const refs = JSON.parse(execFileSync('gh', ['api',
            `repos/${process.env.GITHUB_REPOSITORY}/git/matching-refs/tags/${tag}`], { encoding: 'utf8' }));
          if (process.env.SOURCE_RUN_ID) {
            const run = JSON.parse(execFileSync('gh', ['api',
              `repos/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.SOURCE_RUN_ID}`], { encoding: 'utf8' }));
            if (run.conclusion !== 'success' || run.path !== '.github/workflows/paseo-max-linux.yml') {
              throw new Error('Promotion requires a successful Paseo Max Linux Build run');
            }
            sourceSha = run.head_sha;
          }
          const ref = refs.find(ref => ref.ref === `refs/tags/${tag}`);
          if (process.env.SOURCE_RUN_ID && !ref) {
            throw new Error(`Before promoting a historical build, create ${tag} at ${sourceSha} with maintainer Git credentials.`);
          }
          if (ref) {
            let object = ref.object;
            if (object.type === 'tag') {
              object = JSON.parse(execFileSync('gh', ['api',
                `repos/${process.env.GITHUB_REPOSITORY}/git/tags/${object.sha}`], { encoding: 'utf8' })).object;
            }
            if (object.type !== 'commit' || object.sha !== sourceSha) {
              throw new Error(`${tag} points to a different commit; tags are never moved.`);
            }
          }
          const [owner, name] = process.env.GITHUB_REPOSITORY.split('/');
          const query = 'query($owner:String!,$name:String!,$tag:String!){repository(owner:$owner,name:$name){release(tagName:$tag){isDraft}}}';
          const existing = JSON.parse(execFileSync('gh', ['api', 'graphql', '-f', `query=${query}`,
            '-f', `owner=${owner}`, '-f', `name=${name}`, '-f', `tag=${tag}`], { encoding: 'utf8' }));
          if (existing.data.repository.release !== null) {
            throw new Error(`${tag} already has a release. Choose a new fork version; releases are never overwritten.`);
          }
          fs.appendFileSync(process.env.GITHUB_ENV, `RELEASE_TAG=${tag}\nRELEASE_TAG_EXISTS=${Boolean(ref)}\n`);
          NODE

      - name: Install dependencies
        if: inputs.source_run_id == ''
        run: node scripts/npm-retry.mjs ci

      - name: Set build versions
        if: inputs.source_run_id == ''
        # Keep the desktop and bundled daemon versions equal without publishing packages.
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const root = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const appPackage = fs.readFileSync('packages/app/package.json');
          root.version = process.env.BUILD_VERSION;
          fs.writeFileSync('package.json', `${JSON.stringify(root, null, 2)}\n`);
          execFileSync(process.execPath, ['scripts/sync-workspace-versions.mjs'], { stdio: 'inherit' });
          // Expo also evaluates native version codes during web export.
          fs.writeFileSync('packages/app/package.json', appPackage);
          NODE

      - name: Install Linux packaging and smoke dependencies
        if: inputs.source_run_id == ''
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth rpm

      - name: Build and smoke Linux x64 packages
        if: inputs.source_run_id == ''
        env:
          PASEO_DESKTOP_SMOKE_ARTIFACT_DIR: ${{ runner.temp }}/desktop-smoke
        run: npm run build:desktop -- --publish never --linux --x64 --config electron-builder.max.yml

      - name: Record checksums and build provenance
        if: inputs.source_run_id == ''
        run: |
          cd packages/desktop/release
          sha256sum *.AppImage *.deb *.rpm *.tar.gz > SHA256SUMS
          printf 'Paseo Max %s\nSource: %s\nBuild: %s/%s/actions/runs/%s\n' \
            "$BUILD_VERSION" "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > BUILD.txt

      - name: Upload Linux packages
        if: inputs.source_run_id == ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: paseo-max-linux-x64-${{ inputs.version }}
          path: |
            packages/desktop/release/*.AppImage
            packages/desktop/release/*.deb
            packages/desktop/release/*.rpm
            packages/desktop/release/*.tar.gz
            packages/desktop/release/SHA256SUMS
            packages/desktop/release/BUILD.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Download existing successful build
        if: inputs.source_run_id != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.source_run_id }}
          name: paseo-max-linux-x64-${{ inputs.version }}
          path: packages/desktop/release

      - name: Verify packages and source commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd packages/desktop/release
          sha256sum -c SHA256SUMS
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const runId = process.env.SOURCE_RUN_ID || process.env.GITHUB_RUN_ID;
          const run = JSON.parse(execFileSync('gh', ['api',
            `repos/${process.env.GITHUB_REPOSITORY}/actions/runs/${runId}`], { encoding: 'utf8' }));
          const expected = `Paseo Max ${process.env.BUILD_VERSION}\nSource: ${run.head_sha}\nBuild: ${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${runId}\n`;
          if (fs.readFileSync('BUILD.txt', 'utf8') !== expected) {
            throw new Error('Package provenance does not match the selected build/version');
          }
          fs.appendFileSync(process.env.GITHUB_ENV, `RELEASE_SOURCE_SHA=${run.head_sha}\n`);
          NODE

      - name: Publish Linux prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd packages/desktop/release
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          Experimental Paseo Max desktop build, based on upstream Paseo v${BUILD_VERSION%-max.*}.

          Included plugin capabilities:
          - Compact plugin icons in the fixed sidebar footer through addSidebarFooterIcon.
          - Faint composer suggestions through composer.suggestText, accepted with Tab or Right Arrow as editable drafts. Typing or Escape dismisses the suggestion; nothing is sent automatically.
          - Inactive workspace browser hibernation, keep-awake pins, and faded sleeping tabs.

          Plugins supply the actions, suggestion generation, and hibernation policy. The Task Workspaces plugin is separate and is not bundled in this release.

          Linux x64 packages: AppImage, portable tar.gz, Debian and RPM. The tarball runs without installation: extract it and launch PaseoMax.

          Separate state: ~/.config/Paseo Max and ~/.paseo-max; daemon address 127.0.0.1:17678.
          Automatic updates and global paseo CLI installation are disabled.

          The packaged-app smoke check passed (renderer/preload, bundled daemon, built-in plugins, CLI and terminal). Composer suggestion keyboard acceptance was verified separately in the web app. Full native mobile and packaged-app plugin user journeys were not replayed in this build.

          Source commit: $RELEASE_SOURCE_SHA
          Build: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/${SOURCE_RUN_ID:-$GITHUB_RUN_ID}

          Verify downloads with SHA256SUMS. BUILD.txt records the source and build run.
          EOF
          if [ "$RELEASE_TAG_EXISTS" = false ]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$RELEASE_TAG" -f sha="$RELEASE_SOURCE_SHA"
          fi
          gh release create "$RELEASE_TAG" *.AppImage *.deb *.rpm *.tar.gz SHA256SUMS BUILD.txt \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Paseo Max $BUILD_VERSION — Linux x64" \
            --notes-file "$RUNNER_TEMP/release-notes.md" --draft --prerelease --latest=false
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json url,assets > "$RUNNER_TEMP/release.json"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const release = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/release.json`, 'utf8'));
          const files = fs.readdirSync('.').filter(name => /\.(AppImage|deb|rpm|tar\.gz)$/.test(name) || ['SHA256SUMS', 'BUILD.txt'].includes(name));
          if (files.length !== 6 || release.assets.length !== 6 || files.some(name => !release.assets.some(asset => asset.name === name && asset.size === fs.statSync(name).size))) {
            throw new Error('Published assets do not match the six verified package/provenance files');
          }
          const url = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/releases/tag/${process.env.RELEASE_TAG}`;
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `## Linux prerelease\n\n${url}\n\n| Asset | Bytes |\n|---|---:|\n${release.assets.map(asset => `| ${asset.name} | ${asset.size} |`).join('\n')}\n`);
          console.log(JSON.stringify(release));
          NODE
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false

      - name: Upload smoke diagnostics
        if: always() && inputs.source_run_id == ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: paseo-max-linux-smoke
          path: ${{ runner.temp }}/desktop-smoke
          if-no-files-found: ignore
          retention-days: 7
